<!doctype html><meta charset="utf-8"><title>ツタワタリ Promo Recorder</title>
<style>html,body{margin:0;background:#101820;color:#fff;font:24px system-ui;display:grid;place-items:center;min-height:100vh}main{display:grid;gap:14px;justify-items:center}canvas{height:min(82vh,960px);width:auto;aspect-ratio:9/16;border:1px solid #668}button{font:700 22px system-ui;border:0;border-radius:16px;padding:14px 32px;background:#ffe27a;color:#182c2d;cursor:pointer}p{margin:0;font-size:15px;color:#bed}</style>
<main><canvas id="c" width="1080" height="1920"></canvas><button id="go">動画を書き出す（30秒）</button><p>縦型 9:16 ・ 音声つき MP4</p></main>
<audio id="music" src="/video/work/music.wav" preload="auto"></audio>
<script>
const c=document.querySelector('#c'),x=c.getContext('2d'), W=1080,H=1920, bg=new Image(),hero=new Image();
bg.src='/tools/promo/assets/promo-world.png'; hero.src='/tools/promo/assets/explorer.png';
const beats=[[0,2.2,['いま、離せ！','飛べーーー！'],'#ffe34f','ONE FINGER ACTION'],[2.2,5.5,['長押しで揺らして…','タイミングよくジャンプ！'],'#fff2d0','HOLD  →  RELEASE'],[5.5,8.1,['あーーーっ！','ツタをつかめ！'],'#ff786c','SO CLOSE!'],[8.1,11.5,['落ちても大丈夫！','このツタから続けよう'],'#a9f0c8','KEEP GOING'],[11.5,15.3,['草原から、川へ！','景色がどんどん変わる'],'#80eaff','NEW SCENERY'],[15.3,19.3,['街も、雪山も！','ツタからツタへ！'],'#fff2d0','SWING ON'],[19.3,23.8,['ツタはどこでも','つかめる！'],'#ffe34f','GRAB ANYWHERE'],[23.8,27.2,['キミはどこまで','進めるかな？'],'#ffb7f3','ONE MORE SWING'],[27.2,30,['ツタワタリ','今すぐプレイ！'],'#ffe34f','PLAY NOW']];
const scenes=['草原','川と沼','街','雪国','溶岩帯','砂漠'];
function rr(a,b,w,h,r,fill,stroke){x.beginPath();x.roundRect(a,b,w,h,r);x.fillStyle=fill;x.fill();if(stroke){x.lineWidth=5;x.strokeStyle=stroke;x.stroke()}}
function txt(s,y,size,color='#fff4dc',stroke='#173b3b'){x.textAlign='center';x.font=`900 ${size}px system-ui, sans-serif`;x.lineJoin='round';x.lineWidth=size*.15;x.strokeStyle=stroke;x.strokeText(s,W/2,y);x.fillStyle=color;x.fillText(s,W/2,y)}
function draw(t){let bi=beats.findIndex(b=>t>=b[0]&&t<b[1]);if(bi<0)bi=8;let beat=beats[bi],p=Math.min(1,(t-beat[0])/.25),z=1+Math.sin(p*Math.PI)*.1;
x.clearRect(0,0,W,H);if(bg.complete)x.drawImage(bg,-80+Math.sin(t*.18)*35,-20,1240,1960);x.fillStyle='#06232a66';x.fillRect(0,0,W,H);
// ornamental frame and gameplay viewport
for(let i=0;i<28;i++){let a=i*2.399+t*(.3+i%3*.09),r=470+(i%4)*42,px=W/2+Math.cos(a)*r,py=950+Math.sin(a)*r;x.save();x.translate(px,py);x.rotate(a);x.fillStyle=['#ffe34f','#ff716f','#86f2d1','#82dfff'][i%4];x.globalAlpha=.85;x.fillRect(-7,-12,14,24);x.restore()}
rr(48,260,984,1380,56,'#082a32eb','#ddf2cb');rr(70,282,940,178,40,'#143c3d');
txt('ツタワタリ',398, seventy=72);x.textAlign='center';x.font='700 27px system-ui';x.fillStyle='#bfe9cf';x.fillText('SWING • GRAB • KEEP GOING',W/2,438);
let si=Math.min(5,Math.floor(Math.max(0,t-9)/2.8));x.fillStyle='#dbe7cf';x.font='800 34px system-ui';x.textAlign='left';x.fillText(scenes[si],112,525);x.textAlign='right';x.fillText('TIME  '+('0'+Math.floor(t/60)).slice(-2)+':'+('0'+Math.floor(t%60)).slice(-2),968,525);
rr(90,565,900,850,20,'#5eb9b2');if(bg.complete){let sy=Math.min(bg.height-850,Math.floor(si*bg.height/6));x.save();x.beginPath();x.roundRect(90,565,900,850,20);x.clip();x.drawImage(bg,0,sy,bg.width,850,90,565,900,850);x.fillStyle='#1a573955';x.fillRect(90,565,900,850);x.restore()}
// vines and swinging hero
const sway=Math.sin(t*2.6)*120, hx=480+sway, hy=995+Math.cos(t*2.6)*35; x.lineCap='round';x.lineWidth=18;x.strokeStyle='#287044';x.beginPath();x.moveTo(360,565);x.quadraticCurveTo(380,770,hx,hy-175);x.stroke();x.lineWidth=20;x.beginPath();x.moveTo(800,565);x.quadraticCurveTo(815,735,825,930);x.stroke();
if(hero.complete)x.drawImage(hero,hx-150,hy-210,300,420);
if(t>3.8&&t<5.7||t>19&&t<21){x.beginPath();x.arc(825,940,38+Math.sin(t*18)*20,0,7);x.lineWidth=11;x.strokeStyle='#fff08d';x.stroke()}
// movement streaks
if(t<2||t>14.8&&t<18.8||t>22.8&&t<26.2){for(let i=0;i<7;i++){x.beginPath();x.moveTo(hx-190-i*15,hy+100+i*25);x.lineTo(hx-120-i*15,hy+82+i*25);x.lineWidth=7;x.strokeStyle='#fff0bdcc';x.stroke()}}
rr(110,1445,860,100,30,'#f7d99a','#fff1c8');txt(t<3.6?'● 長押しして、揺らそう':'離してジャンプ！ 次のツタをつかめ',1510,34,'#3b3427','#f7d99a');
// pop comic card
if(t<27.2){x.save();x.translate(540,1715);x.scale(z,z);rr(-450,-145,900,280,42,'#082a32f2',beat[3]);x.restore();txt(beat[4],1650,26,beat[3]);txt(beat[2][0],1720,58,beat[3]);if(beat[2][1])txt(beat[2][1],1792,58,beat[3]);}
if(t>=27.2){x.fillStyle='#06232af5';x.fillRect(70,260,940,1380);rr(105,350,870,1120,52,'#0b3037','#c9ebc3');txt('ツタワタリ',570,106);if(hero.complete)x.drawImage(hero,390,710,300,470);rr(190,1190,700,112,32,'#f4d192','#fff4ce');txt('今すぐプレイ！',1267,48,'#352b20','#f4d192');txt('game.chozo.net/tsutawatari',1435,31);}
}
let start=performance.now(),recorder,parts=[];function loop(now){let t=Math.min(30,(now-start)/1000);draw(t);if(t<30)requestAnimationFrame(loop);else if(recorder?.state==='recording')recorder.stop()}
draw(0);document.querySelector('#go').onclick=async()=>{const audio=document.querySelector('#music');await audio.play();const stream=c.captureStream(30);for(const tr of audio.captureStream().getAudioTracks())stream.addTrack(tr);let mime=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus'].find(MediaRecorder.isTypeSupported);recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:7000000});parts=[];recorder.ondataavailable=e=>e.data.size&&parts.push(e.data);recorder.onstop=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(parts,{type:mime}));a.download=mime.startsWith('video/mp4')?'tsutawatari-promo.mp4':'tsutawatari-promo.webm';a.click();audio.pause();document.querySelector('#go').textContent='書き出し完了';};recorder.start(250);let wake=null;try{wake=await navigator.wakeLock.request('screen')}catch{}start=performance.now();draw(0);let ticker=setInterval(()=>{let t=(performance.now()-start)/1000;draw(Math.min(t,29.97));if(t>=29.95){clearInterval(ticker);draw(29.97);setTimeout(()=>{if(recorder.state==='recording')recorder.stop();wake?.release()},100)}},1000/30);document.querySelector('#go').disabled=true;document.querySelector('#go').textContent='録画中…（30秒）'};
</script>
