<!doctype html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102c32"><meta name="description" content="長押しで揺れて、離してジャンプ。ツタからツタへ、世界を進む縦画面ゲーム。"><meta name="color-scheme" content="dark"><title>ツタワタリ</title><link rel="icon" href="favicon.svg"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"></head>
<body><main id="app">
<header><div class="brand"><span class="eyebrow">VINE TRIP</span><h1>ツタワタリ</h1></div><button id="reset" class="icon-button" aria-label="最初からやり直す">↻</button></header>
<section class="controls" aria-label="ゲームの設定"><div class="options"><label><input id="auto-catch" type="checkbox">自動キャッチ</label><label><input id="guide" type="checkbox">軌道ヒント</label><button id="audio-toggle" type="button" aria-pressed="true" aria-label="BGMと効果音を消音">♪ 音 ON</button></div></section>
<div class="journey"><span id="area-name">01 草原</span><span class="stat">TIME <b id="elapsed-time">00:00.0</b></span><span class="stat">ミス <b id="miss-count">0</b></span><div class="progress"><i id="progress"></i></div></div>
<section id="stage" aria-label="ツタ渡りのゲーム画面"><canvas id="game" aria-label="長押しで勢いをつけ、離してジャンプ。ツタは全体をつかめます。"></canvas><div class="stage-top"><span id="difficulty">まずは、ゆったり一往復</span><span id="state-label">スタート待ち</span></div><div class="instruction"><p id="message">長押しで、勢いをつけよう</p><span id="detail">右へ振れたところで指を離す</span></div><div id="overlay" class="overlay"><div class="card" aria-live="polite" aria-atomic="true"><img id="intro-art" src="assets/explorer.png" alt="" aria-hidden="true"><span id="result-eyebrow" class="eyebrow">VINE TRIP</span><h2 id="result-title">ツタワタリ</h2><p id="result-detail">長押しで揺れて、指を離すとジャンプ。空中で次のツタをつかみます。</p><button id="resume" class="primary">スタート</button><button id="restart" class="secondary" hidden>最初からやり直す</button></div></div><div id="moment-callout" class="moment-callout" role="status" aria-live="polite" aria-atomic="true" hidden></div></section>
<section class="bottom"><button id="pad" disabled><span id="pad-symbol">◎</span><span><strong id="pad-title">スタートを押してください</strong><small id="pad-detail">タイムとミスの回数を記録します</small></span></button><p class="footnote" id="footnote">落下後は最後につかんだツタから再開できます · PCは Space</p></section>
</main><script type="module" src="game.js"></script><script>if('serviceWorker'in navigator&&/^https?:$/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script></body></html>
